name: Publish AnimScape

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out AnimScape
        uses: actions/checkout@v4

      - name: Install xsltproc
        run: |
          sudo apt-get update
          sudo apt-get install --yes xsltproc

      - name: Download blud
        run: |
          curl --fail --location \
            --output blud \
            https://github.com/ronburk/blud/releases/download/ubuntu-build/blud
          chmod +x blud

      - name: Build AnimScape.html
        run: ./blud

      - name: Add build version
        run: |
          version=$(git log -1 --pretty=%B |
            sed -n 's/^Merge pull request #\([0-9][0-9]*\).*/PR #\1/p')
          if [ -z "$version" ]; then
            version="commit ${GITHUB_SHA::7}"
          fi
          sed -i "s/Version: development/Version: $version/" AnimScape.html

      - name: Prepare Pages artifact
        run: |
          mkdir pages
          cp AnimScape.html pages/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
